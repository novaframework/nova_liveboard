name: Erlang CI
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
permissions:
  contents: write
  pull-requests: write
jobs:
  ci:
    uses: Taure/erlang-ci/.github/workflows/ci.yml@v2.1.1
    with:
      # audit + sbom are temporarily off: with this repo's `{vsn, git}` deps,
      # rebar3_sbom badarg's on the `git` atom version and rebar3_audit crashes
      # formatting a LOW-advisory glyph under OTP 29. Re-enable once fixed.
      audit: false
      sbom: false
      sbom-scan: false
      dep-submission: false
      summary: true
